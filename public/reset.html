<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password · The Compass</title>
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="./">
        <svg viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="16" cy="16" r="13"/>
          <path d="M16 3v3M16 26v3M3 16h3M26 16h3" stroke-linecap="round"/>
          <path d="M20.5 11.5 18 18l-6.5 2.5L14 14z" fill="currentColor" fill-opacity=".25" stroke-linejoin="round"/>
        </svg>
        The Compass
      </a>
      <nav class="header-nav" aria-label="Main">
        <a href="./">Archive</a>
      </nav>
    </div>
  </header>

  <main class="page narrow">
    <section>
      <form id="reset-form" class="card form-card" novalidate>
        <h2>Choose a new password</h2>
        <p>After this you'll be signed in here and signed out everywhere else.</p>
        <div class="field">
          <label for="new-password">New password <span class="hint">(at least 8 characters)</span></label>
          <input id="new-password" class="input" type="password" autocomplete="new-password" required>
        </div>
        <div class="field">
          <label for="confirm-password">Type it again</label>
          <input id="confirm-password" class="input" type="password" autocomplete="new-password" required>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Set new password</button>
          <p class="error" id="reset-error" role="alert"></p>
        </div>
      </form>
    </section>
  </main>

  <footer class="site-footer">The Compass · Notes for those who come after. · <a href="guidelines.html">Guidelines &amp; privacy</a></footer>

  <script src="common.js"></script>
  <script src="reset.js"></script>
</body>
</html>
